services:
  - type: web
    name: navigator-pedagoga
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SMARTAPI_API_KEY
        sync: false
      - key: SMARTAPI_BASE_URL
        value: https://api.smartapi.shop/v1
      - key: SMARTAPI_MODEL
        value: gpt-5.6-luna
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: groq/compound
      - key: GROQ_MODEL_VERSION
        value: latest
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
